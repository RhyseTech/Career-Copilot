<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_41 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_41" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_41');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js Production-Ready Glitch Tone & Chromatic Displacement Scene for 404
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, width / height, 0.1, 1000);
camera.position.z = 40;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Glitch Lighting
const ambientLight = new THREE.AmbientLight(0x060b13, 3.2);
scene.add(ambientLight);

const glitchPointCyan = new THREE.PointLight(0x00f0ff, 5.0, 140);
glitchPointCyan.position.set(-20, 15, 25);
scene.add(glitchPointCyan);

const glitchPointMagenta = new THREE.PointLight(0xff0055, 4.5, 140);
glitchPointMagenta.position.set(22, -12, 25);
scene.add(glitchPointMagenta);

const strobeLight = new THREE.PointLight(0xffffff, 0, 80);
strobeLight.position.set(0, 0, 30);
scene.add(strobeLight);

// Group for all glitching elements
const mainGroup = new THREE.Group();
scene.add(mainGroup);

// 1. Fragmented 3D Glitch Ring / Torus Cluster (Representing severed network loop / 404 rupture)
const torusGeo = new THREE.TorusGeometry(12, 0.8, 16, 70);
const glitchTorusMat = new THREE.MeshStandardMaterial({
  color: 0x00f0ff,
  wireframe: true,
  roughness: 0.2,
  metalness: 0.9,
  transparent: true,
  opacity: 0.45
});
const torusMesh = new THREE.Mesh(torusGeo, glitchTorusMat);
torusMesh.rotation.x = Math.PI / 3.2;
mainGroup.add(torusMesh);

// 2. Secondary counter-rotating glitch torus with magenta slice
const torusGeo2 = new THREE.TorusGeometry(14.5, 0.4, 12, 60);
const glitchTorusMat2 = new THREE.MeshStandardMaterial({
  color: 0xff0077,
  wireframe: true,
  roughness: 0.3,
  metalness: 0.8,
  transparent: true,
  opacity: 0.35
});
const torusMesh2 = new THREE.Mesh(torusGeo2, glitchTorusMat2);
torusMesh2.rotation.y = Math.PI / 4;
mainGroup.add(torusMesh2);

// 3. Glitching Wireframe Topography Grid with dynamic vertex tear
const planeGeo = new THREE.PlaneGeometry(100, 70, 50, 40);
const planeMat = new THREE.MeshBasicMaterial({
  color: 0x1e293b,
  wireframe: true,
  transparent: true,
  opacity: 0.18
});
const gridPlane = new THREE.Mesh(planeGeo, planeMat);
gridPlane.rotation.x = -Math.PI / 2.6;
gridPlane.position.y = -14;
gridPlane.position.z = -5;
scene.add(gridPlane);

// 4. Glitch Shards (Polyhedra with chromatic shift and jitter)
const shardGroup = new THREE.Group();
const icosaGeo = new THREE.IcosahedronGeometry(1.3, 0);
const boxGeo = new THREE.BoxGeometry(1.6, 1.6, 1.6);
const octaGeo = new THREE.OctahedronGeometry(1.4, 0);

const shardGeos = [icosaGeo, boxGeo, octaGeo];
const shardMats = [
  new THREE.MeshStandardMaterial({ color: 0x00f0ff, wireframe: true, roughness: 0.1, transparent: true, opacity: 0.65 }),
  new THREE.MeshStandardMaterial({ color: 0xff0066, wireframe: true, roughness: 0.1, transparent: true, opacity: 0.65 }),
  new THREE.MeshStandardMaterial({ color: 0x7c3aed, wireframe: true, roughness: 0.1, transparent: true, opacity: 0.6 })
];

const shards = [];
const shardCount = 28;

for(let i = 0; i < shardCount; i++) {
  const geo = shardGeos[i % shardGeos.length];
  const mat = shardMats[i % shardMats.length];
  const mesh = new THREE.Mesh(geo, mat);
  
  const angle = Math.random() * Math.PI * 2;
  const rad = 12 + Math.random() * 24;
  mesh.position.set(
    Math.cos(angle) * rad,
    (Math.random() - 0.5) * 32,
    (Math.random() - 0.5) * 20
  );
  mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
  const s = 0.5 + Math.random() * 0.9;
  mesh.scale.set(s, s, s);

  mesh.userData = {
    originX: mesh.position.x,
    originY: mesh.position.y,
    originZ: mesh.position.z,
    rotX: (Math.random() - 0.5) * 0.03,
    rotY: (Math.random() - 0.5) * 0.03,
    rotZ: (Math.random() - 0.5) * 0.02,
    speed: 0.001 + Math.random() * 0.003,
    phase: Math.random() * Math.PI * 2,
    isGlitching: false,
    glitchTimer: 0
  };
  shardGroup.add(mesh);
  shards.push(mesh);
}
mainGroup.add(shardGroup);

// 5. Digital Scanlines & Floating Glitch Particles
const pCount = 380;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(pCount * 3);
const pColors = new Float32Array(pCount * 3);

for (let i = 0; i < pCount; i++) {
  pPos[i * 3] = (Math.random() - 0.5) * 110;
  pPos[i * 3 + 1] = (Math.random() - 0.5) * 70;
  pPos[i * 3 + 2] = (Math.random() - 0.5) * 45;

  // Glitch RGB splits
  if (i % 3 === 0) {
    pColors[i * 3] = 0.0;     pColors[i * 3 + 1] = 0.94;  pColors[i * 3 + 2] = 1.0; // Cyan
  } else if (i % 3 === 1) {
    pColors[i * 3] = 1.0;     pColors[i * 3 + 1] = 0.0;   pColors[i * 3 + 2] = 0.45; // Magenta
  } else {
    pColors[i * 3] = 0.55;    pColors[i * 3 + 1] = 0.35;  pColors[i * 3 + 2] = 1.0; // Indigo
  }
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('color', new THREE.BufferAttribute(pColors, 3));

// Particle Texture
const pCanvas = document.createElement('canvas');
pCanvas.width = 16;
pCanvas.height = 16;
const pCtx = pCanvas.getContext('2d');
pCtx.fillStyle = '#ffffff';
pCtx.fillRect(2, 6, 12, 4); // Horizontal glitch slice particle

const pTex = new THREE.CanvasTexture(pCanvas);
const pMat = new THREE.PointsMaterial({
  size: 1.4,
  vertexColors: true,
  map: pTex,
  transparent: true,
  opacity: 0.65,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

// Mouse tracking for parallax and interactive distortion
let mouseX = 0;
let mouseY = 0;
let targetX = 0;
let targetY = 0;

window.addEventListener('mousemove', (e) => {
  const normX = (e.clientX / window.innerWidth) * 2 - 1;
  const normY = -(e.clientY / window.innerHeight) * 2 + 1;
  targetX = normX * 4.5;
  targetY = normY * 3.5;
});

window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

// Animation and Glitch Logic Loop
const clock = new THREE.Clock();
const gridPos = planeGeo.attributes.position;
const vCount = gridPos.count;

let glitchInterval = 0;
let isSystemGlitch = false;
let glitchDuration = 0;

function animate() {
  requestAnimationFrame(animate);
  const elapsedTime = clock.getElapsedTime();
  const delta = clock.getDelta();

  // Mouse interpolation
  mouseX += (targetX - mouseX) * 0.05;
  mouseY += (targetY - mouseY) * 0.05;
  camera.position.x = mouseX;
  camera.position.y = mouseY;
  camera.lookAt(0, 0, 0);

  // Periodic Random Glitch Pulse (glitch tone trigger)
  glitchInterval += 0.016;
  if (glitchInterval > 2.5 + Math.random() * 2.0) {
    isSystemGlitch = true;
    glitchDuration = 0.12 + Math.random() * 0.18;
    glitchInterval = 0;
    strobeLight.intensity = Math.random() > 0.5 ? 2.8 : 0;
  }

  if (isSystemGlitch) {
    glitchDuration -= 0.016;
    if (glitchDuration <= 0) {
      isSystemGlitch = false;
      strobeLight.intensity = 0;
      mainGroup.position.set(0, 0, 0);
    } else {
      // Jitter group translation (chromatic horizontal tearing)
      mainGroup.position.x = (Math.random() - 0.5) * 2.2;
      mainGroup.position.y = (Math.random() - 0.5) * 0.8;
      glitchPointCyan.intensity = 6.5 + (Math.random() - 0.5) * 3;
      glitchPointMagenta.intensity = 6.0 + (Math.random() - 0.5) * 3;
    }
  } else {
    glitchPointCyan.intensity = 4.2;
    glitchPointMagenta.intensity = 3.8;
  }

  // Torus rotations with micro-glitches
  torusMesh.rotation.z = elapsedTime * 0.25;
  torusMesh.rotation.y = elapsedTime * 0.15;
  torusMesh2.rotation.x = -elapsedTime * 0.3;
  torusMesh2.rotation.z = -elapsedTime * 0.2;

  // Grid vertex wave animation with occasional row-tear glitch
  for (let i = 0; i < vCount; i++) {
    const u = gridPos.getX(i);
    const v = gridPos.getY(i);
    let z = Math.sin(u * 0.12 + elapsedTime * 1.5) * Math.cos(v * 0.14 + elapsedTime * 1.1) * 2.4;
    
    // Inject glitch displacement on certain rows during glitch spike
    if (isSystemGlitch && Math.abs(v % 8.0) < 1.5) {
      z += (Math.random() - 0.5) * 3.5;
    }
    gridPos.setZ(i, z);
  }
  gridPos.needsUpdate = true;

  // Shards floating & sporadic individual glitch shifts
  shards.forEach((mesh, idx) => {
    mesh.rotation.x += mesh.userData.rotX;
    mesh.rotation.y += mesh.userData.rotY;
    mesh.rotation.z += mesh.userData.rotZ;

    let posX = mesh.userData.originX + Math.cos(elapsedTime * 0.9 + mesh.userData.phase) * 0.9;
    let posY = mesh.userData.originY + Math.sin(elapsedTime * 1.4 + mesh.userData.phase) * 1.4;
    let posZ = mesh.userData.originZ;

    // Glitch dislocation
    if (isSystemGlitch && idx % 4 === 0) {
      posX += (Math.random() - 0.5) * 4.0;
      posY += (Math.random() - 0.5) * 1.5;
      mesh.scale.x = (0.5 + Math.random() * 0.9) * (Math.random() > 0.7 ? 1.8 : 1.0);
    }
    mesh.position.set(posX, posY, posZ);
  });

  // Particle constellation movement
  particles.rotation.y = elapsedTime * 0.02;
  particles.rotation.x = Math.sin(elapsedTime * 0.02) * 0.05;

  renderer.render(scene, camera);
}

animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_41 -->
</body>
</html>

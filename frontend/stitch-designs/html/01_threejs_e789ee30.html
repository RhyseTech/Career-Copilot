<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_32 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_32" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_32');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js Production-Ready Ambient Holographic Neural Mesh & Dynamic Particles
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
camera.position.z = 45;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0x0a192f, 2.5);
scene.add(ambientLight);

const pointLight1 = new THREE.PointLight(0x6366f1, 4, 120);
pointLight1.position.set(20, 20, 25);
scene.add(pointLight1);

const pointLight2 = new THREE.PointLight(0x00f0ff, 3, 100);
pointLight2.position.set(-25, -15, 20);
scene.add(pointLight2);

// Wave Plane Geometry (Topographic neural surface)
const planeGeo = new THREE.PlaneGeometry(90, 60, 48, 36);
const planeMat = new THREE.MeshStandardMaterial({
  color: 0x1e293b,
  wireframe: true,
  roughness: 0.2,
  metalness: 0.85,
  transparent: true,
  opacity: 0.18
});
const wirePlane = new THREE.Mesh(planeGeo, planeMat);
wirePlane.rotation.x = -Math.PI / 2.8;
wirePlane.position.y = -12;
wirePlane.position.z = -5;
scene.add(wirePlane);

// Ambient Floating Tech Nodes (Floating crystals/nodes)
const nodeGroup = new THREE.Group();
const nodeGeo = new THREE.IcosahedronGeometry(1.2, 0);
const nodeMat = new THREE.MeshPhongMaterial({
  color: 0x00f0ff,
  emissive: 0x4f46e5,
  emissiveIntensity: 0.6,
  shininess: 90,
  wireframe: true,
  transparent: true,
  opacity: 0.45
});

const nodeCount = 18;
const nodes = [];
for(let i = 0; i < nodeCount; i++) {
  const mesh = new THREE.Mesh(nodeGeo, nodeMat);
  mesh.position.set(
    (Math.random() - 0.5) * 80,
    (Math.random() - 0.5) * 45,
    (Math.random() - 0.5) * 25
  );
  mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
  const scale = 0.5 + Math.random() * 0.8;
  mesh.scale.set(scale, scale, scale);
  mesh.userData = {
    rotSpeedX: (Math.random() - 0.5) * 0.02,
    rotSpeedY: (Math.random() - 0.5) * 0.02,
    floatSpeed: 0.001 + Math.random() * 0.002,
    baseY: mesh.position.y,
    phase: Math.random() * Math.PI * 2
  };
  nodeGroup.add(mesh);
  nodes.push(mesh);
}
scene.add(nodeGroup);

// Stardust Particle Constellation
const particleCount = 280;
const pGeometry = new THREE.BufferGeometry();
const pPositions = new Float32Array(particleCount * 3);
const pOriginalY = new Float32Array(particleCount);

for (let i = 0; i < particleCount; i++) {
  pPositions[i * 3] = (Math.random() - 0.5) * 110;
  pPositions[i * 3 + 1] = (Math.random() - 0.5) * 70;
  pPositions[i * 3 + 2] = (Math.random() - 0.5) * 40;
  pOriginalY[i] = pPositions[i * 3 + 1];
}
pGeometry.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));

// Particle Canvas Sprite
const canvas = document.createElement('canvas');
canvas.width = 32;
canvas.height = 32;
const ctx = canvas.getContext('2d');
const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
gradient.addColorStop(0, 'rgba(0, 240, 255, 1)');
gradient.addColorStop(0.35, 'rgba(99, 102, 241, 0.6)');
gradient.addColorStop(1, 'rgba(15, 23, 42, 0)');
ctx.fillStyle = gradient;
ctx.beginPath();
ctx.arc(16, 16, 16, 0, Math.PI * 2);
ctx.fill();

const pTexture = new THREE.CanvasTexture(canvas);
const pMaterial = new THREE.PointsMaterial({
  size: 1.8,
  map: pTexture,
  transparent: true,
  opacity: 0.55,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const particles = new THREE.Points(pGeometry, pMaterial);
scene.add(particles);

// Mouse interaction
let mouseX = 0;
let mouseY = 0;
let targetX = 0;
let targetY = 0;

window.addEventListener('mousemove', (e) => {
  const normX = (e.clientX / window.innerWidth) * 2 - 1;
  const normY = -(e.clientY / window.innerHeight) * 2 + 1;
  targetX = normX * 4;
  targetY = normY * 3;
});

// Resize handler
window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

// Animation Loop
const clock = new THREE.Clock();
const posAttr = planeGeo.attributes.position;
const count = posAttr.count;

function animate() {
  requestAnimationFrame(animate);
  const elapsedTime = clock.getElapsedTime();

  // Smooth camera follow
  mouseX += (targetX - mouseX) * 0.05;
  mouseY += (targetY - mouseY) * 0.05;
  camera.position.x = mouseX;
  camera.position.y = mouseY;
  camera.lookAt(0, 0, 0);

  // Animate topographic surface waves
  for (let i = 0; i < count; i++) {
    const u = posAttr.getX(i);
    const v = posAttr.getY(i);
    const z = Math.sin(u * 0.15 + elapsedTime * 1.2) * Math.cos(v * 0.18 + elapsedTime * 0.9) * 2.2;
    posAttr.setZ(i, z);
  }
  posAttr.needsUpdate = true;

  // Animate node group
  nodes.forEach(node => {
    node.rotation.x += node.userData.rotSpeedX;
    node.rotation.y += node.userData.rotSpeedY;
    node.position.y = node.userData.baseY + Math.sin(elapsedTime * 1.5 + node.userData.phase) * 1.2;
  });

  // Slowly rotate particle field
  particles.rotation.y = elapsedTime * 0.025;
  particles.rotation.x = Math.sin(elapsedTime * 0.015) * 0.08;

  renderer.render(scene, camera);
}

animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_32 -->
</body>
</html>

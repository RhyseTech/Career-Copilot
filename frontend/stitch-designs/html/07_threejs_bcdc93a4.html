<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_38 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_38" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_38');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js Production-Ready 404 Disrupted Coordinate Space & Floating Quantum Shards
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
camera.position.z = 45;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0x0a192f, 2.8);
scene.add(ambientLight);

const pointLightCyan = new THREE.PointLight(0x00f0ff, 4.5, 130);
pointLightCyan.position.set(-25, 18, 30);
scene.add(pointLightCyan);

const pointLightPurple = new THREE.PointLight(0x6366f1, 4.0, 130);
pointLightPurple.position.set(25, -15, 25);
scene.add(pointLightPurple);

const pointLightAlert = new THREE.PointLight(0xec4899, 2.5, 90);
pointLightAlert.position.set(0, 0, 20);
scene.add(pointLightAlert);

// Disrupted Wireframe Void Geometry (Glitching topographic landscape)
const planeGeo = new THREE.PlaneGeometry(95, 65, 48, 36);
const planeMat = new THREE.MeshStandardMaterial({
  color: 0x1e293b,
  wireframe: true,
  roughness: 0.3,
  metalness: 0.8,
  transparent: true,
  opacity: 0.16
});
const wirePlane = new THREE.Mesh(planeGeo, planeMat);
wirePlane.rotation.x = -Math.PI / 2.7;
wirePlane.position.y = -14;
wirePlane.position.z = -6;
scene.add(wirePlane);

// Broken / Glitched floating Polyhedral Clusters (Broken links / 404 nodes)
const nodeGroup = new THREE.Group();
const icosaGeo = new THREE.IcosahedronGeometry(1.4, 0);
const octaGeo = new THREE.OctahedronGeometry(1.2, 0);
const tetraGeo = new THREE.TetrahedronGeometry(1.1, 0);

const matCyan = new THREE.MeshPhongMaterial({
  color: 0x00f0ff,
  emissive: 0x0284c7,
  emissiveIntensity: 0.7,
  shininess: 90,
  wireframe: true,
  transparent: true,
  opacity: 0.45
});

const matPurple = new THREE.MeshPhongMaterial({
  color: 0xa855f7,
  emissive: 0x6366f1,
  emissiveIntensity: 0.8,
  shininess: 90,
  wireframe: true,
  transparent: true,
  opacity: 0.4
});

const matAlert = new THREE.MeshPhongMaterial({
  color: 0xf43f5e,
  emissive: 0xe11d48,
  emissiveIntensity: 0.75,
  shininess: 100,
  wireframe: true,
  transparent: true,
  opacity: 0.4
});

const geos = [icosaGeo, octaGeo, tetraGeo];
const mats = [matCyan, matPurple, matAlert];
const shards = [];

for(let i = 0; i < 24; i++) {
  const geo = geos[i % geos.length];
  const mat = mats[i % mats.length];
  const mesh = new THREE.Mesh(geo, mat);
  
  // Distribute in a toroidal or spherical ambient cloud surrounding center
  const angle = Math.random() * Math.PI * 2;
  const radius = 14 + Math.random() * 26;
  mesh.position.set(
    Math.cos(angle) * radius,
    (Math.random() - 0.5) * 36,
    (Math.random() - 0.5) * 22
  );
  mesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
  const scale = 0.5 + Math.random() * 0.9;
  mesh.scale.set(scale, scale, scale);
  
  mesh.userData = {
    rotSpeedX: (Math.random() - 0.5) * 0.025,
    rotSpeedY: (Math.random() - 0.5) * 0.025,
    rotSpeedZ: (Math.random() - 0.5) * 0.02,
    baseX: mesh.position.x,
    baseY: mesh.position.y,
    phase: Math.random() * Math.PI * 2,
    floatSpeed: 0.0015 + Math.random() * 0.0025,
    driftRadius: 1.5 + Math.random() * 2.0
  };
  nodeGroup.add(mesh);
  shards.push(mesh);
}
scene.add(nodeGroup);

// Stardust Particle Constellation with glitch drift
const particleCount = 320;
const pGeometry = new THREE.BufferGeometry();
const pPositions = new Float32Array(particleCount * 3);

for (let i = 0; i < particleCount; i++) {
  pPositions[i * 3] = (Math.random() - 0.5) * 120;
  pPositions[i * 3 + 1] = (Math.random() - 0.5) * 75;
  pPositions[i * 3 + 2] = (Math.random() - 0.5) * 45;
}
pGeometry.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));

// Particle Glow Sprite
const canvas = document.createElement('canvas');
canvas.width = 32;
canvas.height = 32;
const ctx = canvas.getContext('2d');
const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
gradient.addColorStop(0, 'rgba(0, 240, 255, 1)');
gradient.addColorStop(0.35, 'rgba(168, 85, 247, 0.65)');
gradient.addColorStop(1, 'rgba(15, 23, 42, 0)');
ctx.fillStyle = gradient;
ctx.beginPath();
ctx.arc(16, 16, 16, 0, Math.PI * 2);
ctx.fill();

const pTexture = new THREE.CanvasTexture(canvas);
const pMaterial = new THREE.PointsMaterial({
  size: 1.7,
  map: pTexture,
  transparent: true,
  opacity: 0.6,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const particles = new THREE.Points(pGeometry, pMaterial);
scene.add(particles);

// Interactive mouse parallax
let mouseX = 0;
let mouseY = 0;
let targetX = 0;
let targetY = 0;

window.addEventListener('mousemove', (e) => {
  const normX = (e.clientX / window.innerWidth) * 2 - 1;
  const normY = -(e.clientY / window.innerHeight) * 2 + 1;
  targetX = normX * 4.5;
  targetY = normY * 3.5;
});

window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

// Animation Loop
const clock = new THREE.Clock();
const posAttr = planeGeo.attributes.position;
const vCount = posAttr.count;

function animate() {
  requestAnimationFrame(animate);
  const elapsedTime = clock.getElapsedTime();

  // Smooth camera follow
  mouseX += (targetX - mouseX) * 0.05;
  mouseY += (targetY - mouseY) * 0.05;
  camera.position.x = mouseX;
  camera.position.y = mouseY;
  camera.lookAt(0, 0, 0);

  // Animate undulating floor plane with subtle intermittent wave glitch
  for (let i = 0; i < vCount; i++) {
    const u = posAttr.getX(i);
    const v = posAttr.getY(i);
    const z = Math.sin(u * 0.14 + elapsedTime * 1.3) * Math.cos(v * 0.16 + elapsedTime * 0.95) * 2.2;
    posAttr.setZ(i, z);
  }
  posAttr.needsUpdate = true;

  // Animate shards
  shards.forEach(mesh => {
    mesh.rotation.x += mesh.userData.rotSpeedX;
    mesh.rotation.y += mesh.userData.rotSpeedY;
    mesh.rotation.z += mesh.userData.rotSpeedZ;
    mesh.position.y = mesh.userData.baseY + Math.sin(elapsedTime * 1.4 + mesh.userData.phase) * mesh.userData.driftRadius;
    mesh.position.x = mesh.userData.baseX + Math.cos(elapsedTime * 0.8 + mesh.userData.phase) * 0.8;
  });

  // Slowly rotate particle field with counter-oscillation
  particles.rotation.y = elapsedTime * 0.02;
  particles.rotation.x = Math.sin(elapsedTime * 0.02) * 0.06;

  renderer.render(scene, camera);
}

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_38 -->
</body>
</html>
